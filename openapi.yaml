    "CheckoutRequest":
      "type": "object"
      "properties":
        "cartId":
          "type": "string"
        "customer":
          "type": "object"
          "properties":
            "name":
              "type": "string"
              "minLength": 1
              "maxLength": 100
            "email":
              "type": "string"
              "format": "email"
              "maxLength": 254
          "required":
            - "name"
            - "email"
        "address":
          "type": "object"
          "properties":
            "line1":
              "type": "string"
              "minLength": 1
              "maxLength": 200
            "city":
              "type": "string"
              "minLength": 1
              "maxLength": 200
            "postalCode":
              "type": "string"
              "minLength": 1
              "maxLength": 200
            "country":
              "type": "string"
              "minLength": 1
              "maxLength": 200
          "required":
            - "line1"
            - "city"
            - "postalCode"
            - "country"
        "shippingMethod":
          "type": "string"
          "enum":
            - "standard"
            - "express"
          "default": "standard"
          "description": "Standard costs INR 99, waived when subtotal after discount is >= INR 2500 or FREESHIP is applied. Express always costs INR 199."
        "paymentMethod":
          "type": "string"
          "enum":
            - "test_card"
            - "cash_on_delivery"
          "default": "test_card"
          "description": "Both methods are simulated. No real card details or payment processor."
        "simulatePaymentFailure":
          "type": "boolean"
          "default": false
          "description": "true returns 402 PAYMENT_DECLINED with no changes to cart or stock."
      "required":
        - "cartId"
        - "customer"
        - "address"
