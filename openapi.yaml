"openapi": "3.0.3"
"info":
  "title": "Everyday Demo Store API"
  "version": "1.0.0"
  "description": "Local ecommerce sandbox for testing agents. No authentication or real payments. Create a cart, add products, optionally apply a coupon, then checkout. All prices are INR rupees. Carts, orders, inventory and checkout idempotency records persist in data/store.json. OpenAPI can be imported by an OpenAPI-to-MCP adapter; this file is not itself an MCP server. Reset removes all carts/orders and restores seeded inventory."
"servers":
  - 
    "url": "http://localhost:3000"
    "description": "Local Node server (change URL if using another PORT or an adapter in Docker)."
"tags":
  - 
    "name": "Catalog"
  - 
    "name": "Cart"
  - 
    "name": "Checkout"
  - 
    "name": "Orders"
  - 
    "name": "Testing"
"paths":
  "/api/health":
    "get":
      "operationId": "getHealth"
      "summary": "Check that the store is running"
      "tags":
        - "Testing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "status":
                    "type": "string"
                  "service":
                    "type": "string"
                  "mode":
                    "type": "string"
                "required":
                  - "status"
                  - "service"
                  - "mode"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/categories":
    "get":
      "operationId": "listCategories"
      "summary": "List product categories"
      "tags":
        - "Catalog"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "categories":
                    "type": "array"
                    "items":
                      "type": "string"
                "required":
                  - "categories"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/products":
    "get":
      "operationId": "listProducts"
      "summary": "Search, filter and sort products"
      "tags":
        - "Catalog"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "products":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Product"
                  "total":
                    "type": "integer"
                  "page":
                    "type": "integer"
                  "limit":
                    "type": "integer"
                  "pages":
                    "type": "integer"
                "required":
                  - "products"
                  - "total"
                  - "page"
                  - "limit"
                  - "pages"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        - 
          "name": "q"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
          "description": "Case-insensitive search in product name and description."
        - 
          "name": "category"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
          "description": "Exact category name from listCategories."
        - 
          "name": "minPrice"
          "in": "query"
          "required": false
          "schema":
            "type": "number"
            "minimum": 0
        - 
          "name": "maxPrice"
          "in": "query"
          "required": false
          "schema":
            "type": "number"
            "minimum": 0
        - 
          "name": "inStock"
          "in": "query"
          "required": false
          "schema":
            "type": "boolean"
            "default": false
        - 
          "name": "sort"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "featured"
              - "price_asc"
              - "price_desc"
              - "rating"
              - "name"
            "default": "featured"
        - 
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        - 
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 12
  "/api/products/{productId}":
    "parameters":
      - 
        "name": "productId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "get":
      "operationId": "getProduct"
      "summary": "Get product details and current stock"
      "tags":
        - "Catalog"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Product"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/carts":
    "post":
      "operationId": "createCart"
      "summary": "Create an anonymous cart; keep its returned id"
      "tags":
        - "Cart"
      "responses":
        "201":
          "description": "Cart created"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/carts/{cartId}":
    "parameters":
      - 
        "name": "cartId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "get":
      "operationId": "getCart"
      "summary": "Get cart items, coupon and calculated totals"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "delete":
      "operationId": "clearCart"
      "summary": "Remove all cart items and its coupon"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/carts/{cartId}/items":
    "parameters":
      - 
        "name": "cartId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "post":
      "operationId": "addCartItem"
      "summary": "Add a product; quantity is added to an existing line"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Adding to a cart does not reserve stock. Stock is checked again at checkout. Maximum 99 units per product per cart."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "productId":
                  "type": "string"
                  "example": "p-001"
                "quantity":
                  "type": "integer"
                  "minimum": 1
                  "maximum": 99
                  "default": 1
              "required":
                - "productId"
  "/api/carts/{cartId}/items/{productId}":
    "parameters":
      - 
        "name": "cartId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
      - 
        "name": "productId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "patch":
      "operationId": "updateCartItem"
      "summary": "Set an existing cart item quantity (absolute, not incremental)"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "quantity":
                  "type": "integer"
                  "minimum": 1
                  "maximum": 99
              "required":
                - "quantity"
    "delete":
      "operationId": "removeCartItem"
      "summary": "Remove one product from a cart"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/carts/{cartId}/coupon":
    "parameters":
      - 
        "name": "cartId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "put":
      "operationId": "applyCoupon"
      "summary": "Apply WELCOME10 or FREESHIP; replaces any existing coupon"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "WELCOME10 gives 10% off subtotal, rounded to the nearest whole rupee. FREESHIP waives standard shipping. Codes are case-insensitive. One coupon at a time."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "string"
                  "enum":
                    - "WELCOME10"
                    - "FREESHIP"
              "required":
                - "code"
    "delete":
      "operationId": "removeCoupon"
      "summary": "Remove a cart coupon"
      "tags":
        - "Cart"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Cart"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/checkout":
    "post":
      "operationId": "checkout"
      "summary": "Place a simulated order and clear the cart"
      "tags":
        - "Checkout"
      "responses":
        "200":
          "description": "Original order returned for an idempotent retry"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "201":
          "description": "New order confirmed"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "402":
          "description": "Simulated payment decline; cart and inventory are unchanged"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Rechecks stock and reduces inventory only on success. Empty carts are rejected. Use Idempotency-Key for safe retries of exactly the same JSON request. A repeated key returns the original order; a different body with that key returns 409. After a test reset, idempotency records are removed."
      "parameters":
        - 
          "name": "Idempotency-Key"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 200
          "description": "A unique key per intended checkout; reuse it when retrying the same request."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CheckoutRequest"
  "/api/orders":
    "get":
      "operationId": "listOrders"
      "summary": "List sandbox orders, optionally filtered by email"
      "tags":
        - "Orders"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "orders":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Order"
                "required":
                  - "orders"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        - 
          "name": "email"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "format": "email"
          "description": "Case-insensitive exact customer email; omitted lists all sandbox orders."
  "/api/orders/{orderId}":
    "parameters":
      - 
        "name": "orderId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "get":
      "operationId": "getOrder"
      "summary": "Get a confirmed or cancelled order"
      "tags":
        - "Orders"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/api/orders/{orderId}/cancel":
    "parameters":
      - 
        "name": "orderId"
        "in": "path"
        "required": true
        "schema":
          "type": "string"
    "post":
      "operationId": "cancelOrder"
      "summary": "Cancel an order and restore inventory once"
      "tags":
        - "Orders"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Repeated cancellation is safe. Test payments become refunded_test; simulated cash-on-delivery becomes cancelled."
  "/api/test/reset":
    "post":
      "operationId": "resetSandbox"
      "summary": "Delete all carts/orders and restore the seeded catalog"
      "tags":
        - "Testing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "message":
                    "type": "string"
                  "products":
                    "type": "integer"
                "required":
                  - "message"
                  - "products"
        "400":
          "description": "Invalid request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Insufficient stock or idempotency conflict"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "Unexpected server error"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Destructive sandbox operation for repeatable tests. All previous cart and order IDs become invalid."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "confirm":
                  "type": "string"
                  "enum":
                    - "RESET"
              "required":
                - "confirm"
"components":
  "schemas":
    "Error":
      "type": "object"
      "properties":
        "error":
          "type": "object"
          "properties":
            "code":
              "type": "string"
            "message":
              "type": "string"
          "required":
            - "code"
            - "message"
      "required":
        - "error"
    "Product":
      "type": "object"
      "properties":
        "id":
          "type": "string"
