# Free Render PostgreSQL expires after 30 days. The web service sleeps when idle.
# This mirrors the manually deployed resources in the existing Dummy Ecom project.
services:
  - type: web
    name: dummy-ecom-store
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm test && npm run schema
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: HOST
        value: 0.0.0.0
      - key: COMMERCE_AGENT_INSTALLATION_ID
        value: avxXbN6qieNtdT8kT8B8Vh1b0wp5h7tU
      - key: COMMERCE_AGENT_SERVICE_URL
        value: http://127.0.0.1:5199
      - key: COMMERCE_AGENT_BRIDGE_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dummy-ecom-db
          property: connectionString
databases:
  - name: dummy-ecom-db
    databaseName: everyday_5m20
    region: singapore
    plan: free
    ipAllowList: []
